  }

  // eerste deel verschilt per scherm: "koersen van do 10 sep" (Stand) of "gisteren" (Vandaag)
  function cadenceDelen(eerste, laatste) {
    const d = staat.monitor || {};
    const delen = [];
    if (eerste) delen.push(eerste);
    if (d.hartslag && isGetal(d.hartslag.namen)) delen.push(`${m.getal(d.hartslag.namen)} namen`);
    if (laatste) delen.push(laatste);
    return delen.join(' · ');
  }

  // 6.2: onder de Cadence-rij, alleen als de laatste poging niet lukte
  const kopieRegelHtml = () => (staat.regel ? `<p class="kopie-regel">${h(m.kopieRegel(staat.regel, staat.opgehaald, staat.nu()))}</p>` : '');

  function restRechts(rust, kort) {
    if (rust === true) return `<span class="met-teken goud-tekst">${rusttekenSvg(16)}${kort ? 'actief' : 'actief · niets kopen'}</span>`;
    return `<span class="goud-tekst">${kort ? 'geen' : 'geen · kopen mag'}</span>`;
  }

  /* ---- grafiek ---- */

  const grafieken = new Map();
  let grafiekTeller = 0;

  function grafiekHtml({ reeksen, noot, maat, label, aflezing, onder, extraSvg = () => '', onderExtra = () => '' }) {
    const alle = reeksen.flatMap(r => r.waarden);
    const r = m.raster(alle);
    if (!r) return '';
    const n = Math.max(...reeksen.map(x => x.waarden.length));
    const asLabels = r.lijnen.map(v => maat.asLabel(v));
    // as-labels in een eigen strook links, zodat de lijnen er nooit doorheen lopen
    const goot = Math.ceil(Math.max(...asLabels.map(t => t.length)) * 6.6) + 10;
    maat = { ...maat, links: goot };
    const sch = m.schaal(n, r, maat);
    const id = `grafiek-${++grafiekTeller}`;
    const raster = r.lijnen.map((v, i) => {
      const y = sch.y(v).toFixed(2);
      return `<line class="raster" x1="${goot - 4}" x2="${maat.breedte}" y1="${y}" y2="${y}"/>
        <text class="as-tekst" x="0" y="${y}" dominant-baseline="central">${h(asLabels[i])}</text>`;
    }).join('');
    const lijnen = reeksen.map(x =>
      `<path class="reeks ${x.klasse} s-lijn${x.later ? ' s-later' : ''}" pathLength="1" d="${m.pad(x.waarden, sch)}"/>`).join('');
    let nootHtml = '';
    const nr = reeksen[noot];
    if (nr) {
      let i = nr.waarden.length - 1;
      while (i >= 0 && !isGetal(nr.waarden[i])) i--;
      if (i >= 0) nootHtml = `<g class="s-noot"><circle class="noot gloeit" cx="${sch.x(i).toFixed(2)}" cy="${sch.y(nr.waarden[i]).toFixed(2)}" r="4.5"/></g>`;
    }
    grafieken.set(id, { sch, n, aflezing, maat });
    return `
      <div class="aflezing" id="${id}-aflezing" aria-hidden="true"></div>
      <div class="grafiek" data-grafiek="${id}">
        <svg viewBox="0 0 ${maat.breedte} ${maat.hoogte}" role="img" aria-label="${h(label)}">
          ${raster}${extraSvg(sch)}${lijnen}${nootHtml}
          <line class="peil" id="${id}-peil" x1="0" x2="0" y1="0" y2="${maat.hoogte}" visibility="hidden"/>
        </svg>
      </div>
      <div class="as-onder"><span>${h(onder[0])}</span><span>${h(onder[1])}</span>${onderExtra(sch, maat)}</div>`;
  }

  function koppelGrafieken(wortel) {
    wortel.querySelectorAll('[data-grafiek]').forEach(el => {
      const info = grafieken.get(el.dataset.grafiek);
      if (!info) return;
      const svg = el.querySelector('svg');
      const peil = svg.querySelector('.peil');
      const uit = document.getElementById(`${el.dataset.grafiek}-aflezing`);
      const toon = e => {
        const kader = svg.getBoundingClientRect();
        const x = (e.clientX - kader.left) / kader.width * info.maat.breedte;
        const i = info.sch.index(x);
        const px = info.sch.x(i).toFixed(2);
        peil.setAttribute('x1', px); peil.setAttribute('x2', px); peil.setAttribute('visibility', 'visible');
        uit.innerHTML = info.aflezing(i);
        uit.classList.add('zichtbaar');
      };
      const verberg = () => { peil.setAttribute('visibility', 'hidden'); uit.classList.remove('zichtbaar'); };
      el.addEventListener('pointerdown', e => { toon(e); el.setPointerCapture && el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove', e => { if (peil.getAttribute('visibility') === 'visible') toon(e); });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, verberg));
    });
  }

  const rondBedrag = v => m.euro(v);
  const rondeKoers = v => {
    const dec = Math.abs(v) < 10 && !Number.isInteger(v) ? 2 : Number.isInteger(v) ? 0 : 1;
    return m.euro(v, dec);
  };

  /* ---- 5.1 Stand ---- */

  function scherm_stand(d) {
    const blok = inzetTeller();
    const st = d.stand || {};
    const v = m.standVerschil(st), b = m.standBalken(st);
    const hs = hartslagNu();
    let html = '';
    // 6.1: bij een oude run schrijft de app zelf de openingszin; bij een fout komt de runtekst onder de zin
    if (hs && hs.soort === 'oud') {
      html += blok(`<div class="zin-blok"><p class="zin alarm">${h(m.oudZin(hs, (d.hartslag && d.hartslag.laatste_dag) || st.datum))}</p></div>`);
    } else {
      const zin = st.zin ? zinBlok(st.zin) : '';
      const fout = hs && hs.soort === 'fout' && hs.tekst ? `<p class="zin-extra alarm">${h(hs.tekst)}</p>` : '';
      if (zin || fout) html += blok(zin + fout);
    }

    if (v) {
      html += blok(`<div class="held-blok">
        <div class="label">Tenor boven Baseline · na kosten</div>
        <div class="held" aria-label="${h(m.pt(v.verschil))} procentpunt">${h(m.pt(v.verschil))}<span class="eenheid">pt</span></div>
      </div>`);
    }

    if (b && v) {
      html += blok(`<div class="balken">
        <div class="balkrij"><span class="balk tenor s-balk gloeit" style="width:${(b.tenor * 100).toFixed(2)}%"></span>
          <span class="balkwaarde">${h(m.euro(st.portefeuille))} ${rendementHtml(v.tenor)}</span></div>
        <div class="balkrij"><span class="balk baseline s-balk s-later" style="width:${(b.baseline * 100).toFixed(2)}%"></span>
          <span class="balkwaarde gedimd">${h(m.euro(st.tracker))} ${h(m.pct(v.baseline, 1, true))}</span></div>
        <div class="legende"><span class="label goud">Tenor</span><span class="label">Baseline · EXSA.DE</span></div>
      </div>`);
    }

    const punten = st.sinds_start || [];
    if (punten.length) {
      const tenor = punten.map(p => p[1]), base = punten.map(p => p[2]);
      const grafiek = grafiekHtml({
        reeksen: [{ waarden: tenor, klasse: 'tenor' }, { waarden: base, klasse: 'baseline', later: true }],
        noot: 0,
        maat: { breedte: 350, hoogte: 140, links: 0, rechts: 6, boven: 16, onder: 6, asLabel: rondBedrag },
        label: `Tenor en Baseline sinds ${m.datum(punten[0][0], 'dm')}: Tenor ${m.euro(tenor[tenor.length - 1])}, Baseline ${m.euro(base[base.length - 1])}`,
        onder: [m.datum(punten[0][0], 'as'), 'nu'],
        aflezing: i => `${h(m.datum(punten[i][0], 'as'))} · <span class="goud-tekst">${h(m.euro(tenor[i]))}</span> · <span style="color:var(--mute)">${h(m.euro(base[i]))}</span>`,
        extraSvg: () => ''
      });
      html += blok(`<div class="lijn"></div><div class="grafiek-blok">${grafiek}</div>`);
    }

    const rijen = [];
    const br = d.beslisregel;
    if (br && isGetal(br.dag) && isGetal(br.van)) {
      const sub = [br.oordeeldatum ? `oordeel ${m.datum(br.oordeeldatum, 'dmj')}` : '',
        isGetal(br.marge_pp) ? `stop bij ${m.getal(-br.marge_pp)}${S}pt` : ''].filter(Boolean).join(' · ');
      const vg = m.voortgang(br);
      rijen.push(rij({
        titel: 'Beslisregel', sub, rechts: `dag ${h(m.getal(br.dag))} / ${h(m.getal(br.van))}`,
        onder: vg != null ? `<div class="voortgang"><span class="s-balk" style="width:${(vg * 100).toFixed(2)}%"></span></div>` : ''
      }));
    }
    const rust = m.rust(d);
    if (rust !== null) {
      const af = d.marktfilter.afstand;
      rijen.push(rij({ titel: 'Rest', sub: isGetal(af) ? `marktfilter · maandslot ${m.pct(af, 1, true)}` : '', rechts: restRechts(rust, false), rechtsTekst: true }));
    }
    const k = d.kosten;
    if (k && isGetal(k.beurstaks) && isGetal(k.spread)) {
      const start = st.start && st.start.datum;
      rijen.push(rij({ titel: 'Betaalde kosten', sub: start ? `beurstaks en spread sinds ${m.datum(start, 'dm')}` : 'beurstaks en spread', rechts: h(m.euro(k.beurstaks + k.spread)) }));
    }
    if (hs && hs.tijd) {
      const koersen = st.datum ? `koersen van ${m.datum(st.datum, 'wdm')}` : '';
      rijen.push(rij({ titel: 'Cadence', sub: cadenceDelen(koersen, `volgende ${m.volgendeRun(hs.tijd, staat.nu())}`), rechts: cadenceRechts(hs) }));
    }
    if (rijen.length) html += blok(`<div class="rijen">${rijen.join('')}</div>${kopieRegelHtml()}`);
    return html;
  }

  /* ---- 5.2 Portefeuille ---- */

  function scherm_portefeuille(d) {
    const blok = inzetTeller();
    const posities = d.posities || [];
    const sortering = m.actieveSortering(Instellingen.lees().sortering, posities);
    const rang = sortering === 'rang';
    let onder = d.posities ? `${posities.length} ${posities.length === 1 ? 'positie' : 'posities'}` : '';
    // rang komt uit de maandrangorde: dan de peildatum in plaats van het aantal
    if (rang && d.rangorde_datum) onder = `rangorde ${m.datum(d.rangorde_datum, 'dagmaand')}`;
    const labels = m.sorteringen(posities).map(k =>
      `<button type="button" class="keuze" data-sortering="${k}" aria-pressed="${k === sortering}">
        <span class="label">${h(m.sorteerLabel(k))}</span><span class="tabnoot"></span></button>`).join('');
    // de sorteerregel vervangt de legende en is meteen de kolomkop
    const regel = labels ? `<div class="sorteerregel"><div class="keuzes" role="group" aria-label="Sortering">${labels}</div></div>` : '';
    let html = `<div class="vast">${blok(titelRij('Portefeuille', onder))}${regel ? blok(regel) : ''}</div>`;

    const rijen = m.portefeuilleRijen(d, sortering).map(r => {
      if (r.soort === 'grens') return `<div class="grenslijn label">${h(m.TOP60_BUITEN)}</div>`;
      // cash is de laatste rij ván de portefeuille, ook bij € 0: "volledig belegd" is informatie
      if (r.soort === 'cash') return `<div class="rij cash"><span class="label">${h(r.label)}</span><span class="rij-rechts">${h(m.euro(r.bedrag))}</span></div>`;
      const p = r.positie, tag = m.gewichtTag(p.gewicht);
      return `<button type="button" class="rij positie" data-ticker="${h(p.ticker)}" aria-label="${h(m.positieLabel(p, { rang }))}">
        <div class="positie-lijn">
          ${rang ? `<span class="rangnummer">${isGetal(p.rang) ? h(m.getal(p.rang)) : ''}</span>` : ''}
          <span class="ticker">${h(p.ticker)}</span>
          <span class="naam">${h(p.naam)}</span>
          ${tag ? tagHtml(tag === 'AFROOMBAAR' ? 'afroombaar' : 'restje', tag) : ''}
          ${isGetal(p.rendement) ? `<span class="rendement">${rendementHtml(p.rendement)}</span>` : ''}
          ${isGetal(p.gewicht) ? `<span class="gewicht">${h(m.pct(p.gewicht, 1))}</span>` : ''}
        </div>
      </button>`;
    }).join('');
    html += blok(`<div class="rijen portefeuille">${rijen}</div>`);
    return html;
  }

  /* ---- 5.3 Vandaag ---- */

  function scherm_vandaag(d) {
    const blok = inzetTeller();
    const vd = d.vandaag || {};
    const rust = m.rust(d);
    let html = blok(titelRij('Vandaag', m.datum(vd.datum)));
    if (vd.zin) html += blok(zinBlok(vd.zin, rust === true));

    const secties = [['verkopen', 'Verkopen', 'verkoop', 'VERKOOP'], ['kopen', 'Kopen', 'koop', 'KOOP'], ['afromingen', 'Afromingen', 'afroming', 'AFROMING']];
    const sectieHtml = secties.map(([sleutel, titel, soort, tekst]) => {
      if (!Array.isArray(vd[sleutel])) return '';
      const rijen = vd[sleutel];
      const inhoud = rijen.length ? rijen.map(t => {
        const rechts = [isGetal(t.aantal) ? m.stuks(t.aantal) : '', isGetal(t.bedrag) ? m.euro(t.bedrag) : ''].filter(Boolean).join(' · ');
        const reden = t.reden || (t.voor ? `voor ${t.voor}` : '');
        return `<div class="rij transactie">
          <div class="rij-hoofd">
            <div class="positie-lijn">${tagHtml(soort, tekst)}<span class="ticker">${h(t.ticker)}</span><span class="naam">${h(t.naam)}</span></div>
            ${reden ? `<div class="reden">${h(reden)}</div>` : ''}
          </div>
          ${rechts ? `<div class="rij-rechts">${h(rechts)}</div>` : ''}
        </div>`;
      }).join('') : `<p class="leeg">${h(m.legeZin(sleutel, { rust: rust === true, open_plaatsen: vd.open_plaatsen, cash: vd.cash }))}</p>`;
      return `<section class="sectie"><div class="sectie-kop"><span class="label">${titel}</span><span class="label">${rijen.length}</span></div>${inhoud}</section>`;
    }).join('');
    // de rustige dag: de cursieve zin zegt het al, de drie secties vervallen
    if (sectieHtml && !m.rustigeDag(d)) html += blok(sectieHtml);

    const onder = [];
    if (rust !== null) {
      const af = d.marktfilter.afstand;
      const subHtml = h(m.maandslotTekst(af)).replace('het 10-maandsgemiddelde', '<span class="heel">het 10-maandsgemiddelde</span>');
      onder.push(rij({ titel: 'Rest', subHtml, rechts: restRechts(rust, true), rechtsTekst: true }));
    }
    const hs = hartslagNu();
    if (hs && hs.tijd) {
      const peil = d.rangorde_datum;
      onder.push(rij({ titel: 'Cadence', sub: cadenceDelen(m.relatieveDag(hs.tijd, staat.nu()), peil ? `rangorde ${m.datum(peil, 'dagmaand')}` : ''), rechts: `<span class="stip"></span>${cadenceRechts(hs)}` }));
    }
    if (onder.length) html += blok(`<div class="rijen" style="margin-top:24px">${onder.join('')}</div>${kopieRegelHtml()}`);
    return html;
  }

  /* ---- 5.5 Grootboek ---- */

  function scherm_grootboek(d) {
    const blok = inzetTeller();
    const tickers = new Set((d.posities || []).map(p => p.ticker));
    const filter = staat.filter;
    const groepen = m.grootboekPerDag(d.grootboek, filter);
    const aantal = groepen.reduce((a, g) => a + g.rijen.length, 0);
    const onder = d.grootboek ? `${aantal} ${aantal === 1 ? 'transactie' : 'transacties'}${filter ? ` · ${filter}` : ''}` : '';
    let html = blok(titelRij('Grootboek', onder));
    const k = d.kosten;
    if (k) {
      const kolom = (label, waarde) => (waarde ? `<div><div class="label">${label}</div><div class="strook-waarde">${h(waarde)}</div></div>` : '');
      const inhoud = kolom('Beurstaks', isGetal(k.beurstaks) ? m.euro(k.beurstaks) : '') +
        kolom('Spread', isGetal(k.spread) ? m.euro(k.spread) : '') +
        kolom('Omzet', isGetal(k.omzet) ? `${m.getal(k.omzet, 1)}×` : '');
      if (inhoud) html += blok(`<div class="strook">${inhoud}</div>`);
    }
    const dagen = groepen.map(g => `<section class="dag">
      ${g.datum ? `<div class="label">${h(m.datum(g.datum, 'lang'))}</div>` : ''}
      ${g.rijen.map(r => {
        const [soort, tekst] = KANT_TAG[r.kant] || [];
        const regels = m.grootboekRegels(r);
        const klikbaar = tickers.has(r.ticker);
        const tag = klikbaar ? 'button' : 'div';
        return `<${tag} class="rij"${klikbaar ? ` type="button" data-ticker="${h(r.ticker)}" data-herkomst="grootboek"` : ''}>
          <div class="rij-hoofd"><div class="positie-lijn">${soort ? tagHtml(soort, tekst) : ''}<span class="ticker">${h(r.ticker)}</span></div></div>
          <div class="rij-rechts">${h(regels.boven)}${regels.onder ? `<span class="klein">${h(regels.onder)}</span>` : ''}</div>
        </${tag}>`;
      }).join('')}
    </section>`).join('');
    html += blok(dagen);
    return html;
  }

  /* ---- 5.6 Detail ---- */

  function scherm_detail(d) {
    const blok = inzetTeller();
    const p = (d.posities || []).find(x => x.ticker === staat.detail.ticker);
    if (!p) return '';
    const meta = [p.ticker, p.sector, isGetal(p.sector_n) && isGetal(p.sector_max) ? `${p.sector_n} van ${p.sector_max}` : ''].filter(Boolean).join(' · ');
    const tag = m.bovenAfroomgrens(p.gewicht) ? tagHtml('afroombaar', 'AFROOMBAAR') : '';
    // de beschrijving is niet cursief: cursief blijft voor de zin die de toestand vertelt
    let html = blok(`<div class="detail-kop"><div class="detail-meta">${h(meta)}</div>
      <div class="detail-naam"><h1 class="titel">${h(p.naam || p.ticker)}</h1>${tag}</div>
      ${p.beschrijving ? `<p class="beschrijving">${h(p.beschrijving)}</p>` : ''}</div>`);

    const koers = isGetal(p.koers) ? `<div><div class="label">Koers</div><div class="kolom-waarde">${h(m.euro(p.koers, 2))}</div>
      ${isGetal(p.dagkoers_verandering) ? `<div class="kolom-sub">vandaag ${h(m.pct(p.dagkoers_verandering, 1, true))}</div>` : ''}</div>` : '<div></div>';
    const winst = m.winstTekst(p.winst_eur);
    const r = m.rendementWeergave(p.rendement, { detail: true });
    const instap = r ? `<div><div class="label">Sinds instap</div>
      <div class="kolom-waarde${r.positief ? ' goud' : ''}">${h(r.tekst)}</div>
      ${winst ? `<div class="kolom-sub">${h(winst)}</div>` : ''}</div>` : '';
    html += blok(`<div class="kolommen">${koers}${instap}</div>`);

    const reeks = p.reeks || [], sma = p.sma_reeks || [];
    if (reeks.some(isGetal)) {
      const n = reeks.length;
      const woorden = m.smaLabel(p.koers_vs_sma200);          // afstand_sma200 wordt nooit gelezen
      const smaLabel = sch => {
        let i = sma.length - 1;
        while (i >= 0 && !isGetal(sma[i])) i--;
        if (i < 0 || !woorden) return '';
        // onder de SMA-lijn als de koers erboven staat, erboven als de koers eronder staat; nooit door de lijn
        const kLaatste = [...reeks].reverse().find(isGetal);
        const erOnder = isGetal(kLaatste) && kLaatste >= sma[i];
        const rechts = sch.x(i) - 10, breedte = woorden.length * 7.9;
        const ys = sma.map((v, j) => (isGetal(v) && sch.x(j) >= rechts - breedte && sch.x(j) <= rechts ? sch.y(v) : null)).filter(v => v !== null);
        let y = erOnder ? Math.max(...ys) + 15 : Math.min(...ys) - 7;
        if (y > 150 - 2) y = Math.min(...ys) - 7;
        if (y < 10) y = Math.max(...ys) + 15;
        return `<text class="sma-label" x="${rechts.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="end">${h(woorden)}</text>`;
      };
      // de instapstreep: een hairline op de instapdag, achter de lijnen
      const ii = m.instapIndex(d.handelsdagen, p.instap, n);
      const streep = sch => (ii == null ? '' : `<line class="instapstreep" x1="${sch.x(ii).toFixed(2)}" x2="${sch.x(ii).toFixed(2)}" y1="0" y2="150"/>`);
      const instapLabel = (sch, maat) => {
        if (ii == null || !m.instapLabelPast(sch.x(ii), maat.breedte)) return '';
        return `<span class="instap-label" style="left:${(sch.x(ii) / maat.breedte * 100).toFixed(2)}%">instap</span>`;
      };
      const grafiek = grafiekHtml({
        reeksen: [{ waarden: reeks, klasse: 'tenor' }, { waarden: sma, klasse: 'sma', later: true }],
        noot: 0,
        maat: { breedte: 350, hoogte: 150, links: 0, rechts: 6, boven: 16, onder: 6, asLabel: rondeKoers },
        label: `Koers en SMA200 over 200 dagen: koers ${m.euro(p.koers, 2)}${isGetal(p.sma200) ? `, SMA200 ${m.euro(p.sma200, 2)}` : ''}${woorden ? `, ${woorden.toLowerCase().replace('sma200', 'SMA200')}` : ''}`,
        onder: ['200 dagen geleden', 'nu'],
        aflezing: i => `${[m.datum(m.dagVanPunt(d.handelsdagen, i, n), 'wdm')].filter(Boolean).map(t => `${h(t)} · `).join('')}<span class="goud-tekst">koers ${h(m.euro(reeks[i], 2))}</span>${isGetal(sma[i]) ? ` · <span style="color:var(--mute)">SMA ${h(m.euro(sma[i], 2))}</span>` : ''}`,
        extraSvg: sch => streep(sch) + smaLabel(sch),
        onderExtra: instapLabel
      });
      html += blok(`<div class="grafiek-blok">${grafiek}
        <div class="legende"><span class="label goud">Koers</span><span class="label">SMA200 · verkoopdrempel</span></div></div>`);
    }

    const rijen = [];
    if (isGetal(p.gewicht)) {
      rijen.push(rij({ titel: 'Gewicht', sub: isGetal(p.gewicht_bij_aankoop) ? `${m.pct(p.gewicht_bij_aankoop, 1)} bij aankoop` : '', rechts: h(m.pct(p.gewicht, 1)) }));
    }
    if (p.instap) {
      rijen.push(rij({ titel: 'Instap', sub: isGetal(p.dagen) ? `${m.dagenTekst(p.dagen)} in bezit` : '',
        rechts: h([m.datum(p.instap, 'cijfers'), isGetal(p.koers_in) ? m.euro(p.koers_in, 2) : ''].filter(Boolean).join(' · ')) }));
    }
    if (isGetal(p.rang) || isGetal(p.score)) {
      rijen.push(rij({ titel: 'Rangorde', sub: m.rangordeSub(p, d.rangorde_datum), rechts: h(m.rangordeRechts(p)) }));
    }
    // het dividend zit niet in het rendement sinds instap: dat is koersrendement, en het dividend staat in de cash
    if (m.toonDividend(p)) {
      rijen.push(rij({ titel: 'Dividend', sub: m.dividendRegel(d.grootboek, p.ticker, p.instap), rechts: h(m.euro(p.dividend_eur, 2)) }));
    }
    const t = m.transactiesVoorNaam(d.grootboek, p.ticker);
    if (t.aantal) {
      rijen.push(rij({ titel: 'Transacties', sub: t.lijst, rechts: h(t.soorten), rechtsTekst: true, knop: `data-filter="${h(p.ticker)}"` }));
    }
    if (rijen.length) html += blok(`<div class="rijen" style="margin-top:8px">${rijen.join('')}</div>`);
    return html;
  }

  /* ---- 6.2 Laden ---- */

  const WACHT_NA = 8000;
  const WACHTREGEL = '<p class="laden-wacht">Geen verbinding. Tenor wacht op het netwerk.</p>';

  function scherm_laden() {
    if (!staat.ladenSinds) staat.ladenSinds = Date.now();
    const lang = Date.now() - staat.ladenSinds >= WACHT_NA;
    return `<div class="laden">
      <div class="merk groot" aria-hidden="true">${merkSvg()}</div>
      <p class="zin">Tenor haalt de stand op.</p>${lang ? WACHTREGEL : ''}
    </div>`;
  }

  // de regel komt erbij zonder het scherm opnieuw te tekenen, zodat de strijk niet herbegint
  function wachtOpLaden() {
    clearTimeout(wachtOpLaden.klok);
    if (staat.modus !== 'laden') { staat.ladenSinds = null; return; }
    const rest = WACHT_NA - (Date.now() - staat.ladenSinds);
    wachtOpLaden.klok = setTimeout(() => {
      const laden = document.querySelector('.laden');
      if (staat.modus === 'laden' && laden && !laden.querySelector('.laden-wacht')) laden.insertAdjacentHTML('beforeend', WACHTREGEL);
    }, Math.max(rest, 0));
  }

  /* ---- 5.7 Instellingen ---- */

  const VERSIE = '0.5.1';  // gelijk houden met VERSIE in sw.js
  const TEST_ZIN = {
    ok: 'Het token werkt.',
    token: 'GitHub weigert dit token. Maak een nieuw aan met alleen contents: read.',
    offline: 'Geen verbinding. Probeer opnieuw zodra je online bent.',
    'time-out': 'GitHub antwoordt niet. Probeer opnieuw.',
    onvolledig: 'Vul eigenaar/repo en het leestoken in.'
  };

  function instellingenVakken() {
    const test = staat.test;
    const nietGevonden = staat.melding === 'niet-gevonden' || (test && test.soort === 'niet-gevonden');
    let testZin = '';
    if (test && test.soort !== 'niet-gevonden') {
      testZin = test.fout || TEST_ZIN[test.soort] || `GitHub antwoordde met ${test.status}. Probeer later opnieuw.`;
    }
    return {
      melding: staat.melding === 'token' ? '<p class="zin-extra alarm melding">Het leestoken werkt niet.</p>' : '',
      repo: nietGevonden ? '<p class="veld-regel">Niet gevonden — klopt de repo of het pad?</p>' : '',
      test: testZin ? `<span class="${test.soort === 'token' ? 'alarm' : ''}">${h(testZin)}</span>` : '',
      kopie: staat.opgehaald ? `kopie van ${m.datum(m.leesTijd(staat.opgehaald), 'wdm')} ${m.tijd(staat.opgehaald)}` : 'geen kopie'
    };
  }

  function scherm_instellingen() {
    const blok = inzetTeller();
    const ins = Instellingen.lees();
    const vak = instellingenVakken();
    let html = blok(titelRij('Instellingen', '') + `<div data-vak="melding">${vak.melding}</div>`);
    html += blok(`
      <label class="veld"><span class="label">Eigenaar/repo</span>
        <input class="invoer" data-veld="repo" type="text" value="${h(ins.repo)}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <div class="veld-onder" data-vak="repo">${vak.repo}</div>
      <label class="veld"><span class="label">Leestoken</span>
        <input class="invoer" data-veld="token" type="password" value="${h(ins.token)}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <div class="rijen">${rij({ titel: 'Token testen', subHtml: `<span data-vak="test">${vak.test}</span>`, knop: 'data-actie="test"' })}</div>`);

    const keuzes = [['automatisch', 'Automatisch'], ['dag', 'Dag'], ['avond', 'Avond']].map(([k, naam]) =>
      `<button type="button" class="keuze" data-thema-keuze="${k}" aria-pressed="${ins.thema === k}">
        <span class="label">${naam}</span><span class="tabnoot"></span></button>`).join('');
    html += blok(`<div class="veld"><span class="label">Thema</span><div class="keuzes" role="group" aria-label="Thema">${keuzes}</div></div>`);

    html += blok(`<div class="rijen ruimte">
      ${rij({ titel: 'Versie', subHtml: `<span data-vak="kopie">${h(vak.kopie)}</span>`, rechts: h(VERSIE) })}
      ${rij({ titel: 'Laatste kopie wissen', knop: 'data-actie="wis"' })}
    </div>`);
    return html;
  }

  // werkt meldingen, regels en kop bij terwijl de velden (en hun focus) blijven staan
  function werkInstellingenBij() {
    const vak = instellingenVakken();
    for (const [naam, html] of Object.entries(vak)) {
      const el = document.querySelector(`[data-vak="${naam}"]`);
      if (el) el.innerHTML = naam === 'kopie' ? h(html) : html;
    }
    zetHtml(document.getElementById('kop'), kopHtml());
    const tabbalk = document.getElementById('tabbalk');
    zetHtml(tabbalk, tabbalkHtml());
    tabbalk.hidden = tabbalk.innerHTML === '';
  }

  /* ---- kop, tabbalk, tekenen ---- */

  const TAB_NAAM = Object.fromEntries(TABS);
  const merkHtml = langeDruk =>
    `<div class="merk" id="merk"${langeDruk ? ' data-lange-druk' : ''} aria-label="Tenor">${merkSvg()}<span class="merk-woord">TENOR</span></div>`;
  const terugHtml = (label, attr) =>
    `<button type="button" class="terug" ${attr}>${icoon('terug')}<span class="label terug-label">${h(label)}</span></button>`;

  function kopHtml() {
    if (staat.modus === 'laden') return '';
    const ins = Instellingen.lees();
    const hs = staat.monitor ? hartslagNu() : null;
    const cadence = staat.monitor
      ? `<span class="cadence${hs && hs.soort !== 'ok' ? ' alarm' : ''}">${h(m.cadenceLabel(hs))}</span>` : '';
    let links;
    if (staat.modus === 'instellingen') {
      // zonder kopie is er niets om naar terug te keren
      links = staat.monitor ? terugHtml(TAB_NAAM[staat.tab], 'data-sluit-instellingen') : merkHtml(false);
    } else if (staat.detail) {
      links = terugHtml(staat.detail.herkomst === 'grootboek' ? 'Grootboek' : 'Portefeuille', 'data-terug');
    } else if (staat.tab === 'grootboek' && staat.filter) {
      links = terugHtml('Grootboek', 'data-filter-weg');
    } else {
      links = merkHtml(true);
    }
    const tandwiel = staat.modus === 'app' && !staat.detail && staat.tab === 'stand' && !ins.token
      ? `<button type="button" class="tandwiel" data-open-instellingen aria-label="Instellingen">${icoon('tandwiel')}</button>` : '';
    return `${links}<div class="kop-rechts">${cadence}${tandwiel}</div>`;
  }

  function tabbalkHtml() {
    if (staat.modus === 'laden' || (staat.modus === 'instellingen' && !staat.monitor)) return '';
    return TABS.map(([sleutel, naam]) =>
      `<button type="button" class="tab" data-tab="${sleutel}"${staat.modus === 'app' && staat.tab === sleutel ? ' aria-current="page"' : ''}>
        ${icoon(sleutel)}<span class="label">${naam}</span><span class="tabnoot"></span>
      </button>`).join('');
  }

  // vervang alleen wat veranderd is, zodat een lopende strijk in de kop niet herbegint
  const vorige = new Map();
  function zetHtml(el, html) {
    if (vorige.get(el) === html) return;
    vorige.set(el, html);
    el.innerHTML = html;
  }

  function teken({ beweging = null, stil = false, bovenaan = false } = {}) {
    const d = staat.monitor || {};
    const app = document.getElementById('app'), kop = document.getElementById('kop');
    const scherm = document.getElementById('scherm'), tabbalk = document.getElementById('tabbalk');
    grafieken.clear();
    Thema.rust(!!staat.monitor && m.rust(d) === true);
    app.dataset.modus = staat.modus;
    zetHtml(kop, kopHtml());
    zetHtml(tabbalk, tabbalkHtml());
    tabbalk.hidden = tabbalk.innerHTML === '';
    app.style.setProperty('--kophoogte', `${scherm.offsetTop}px`);

    if (staat.detail && !m.detailGeldig(staat.detail, d.posities)) {
      staat.detail = null;                       // naam niet meer in portefeuille: terug naar waar je vandaan kwam
      zetHtml(kop, kopHtml());
      zetHtml(tabbalk, tabbalkHtml());
    }

    let inhoud;
    if (staat.modus === 'laden') inhoud = scherm_laden();
    else if (staat.modus === 'instellingen') inhoud = scherm_instellingen();
    else if (staat.detail) inhoud = scherm_detail(d);
    else inhoud = ({ stand: scherm_stand, portefeuille: scherm_portefeuille, vandaag: scherm_vandaag, grootboek: scherm_grootboek })[staat.tab](d);

    const scroll = scherm.scrollTop;
    scherm.innerHTML = `<div class="schermvlak${stil ? ' stil' : ''}${beweging ? ' ' + beweging : ''}">${inhoud}</div>`;
    scherm.scrollTop = stil && !bovenaan ? scroll : 0;

    // 1. Strijk: alleen bij openen
    if (staat.eersteKeer && !stil) {
      staat.eersteKeer = false;
      app.classList.add('strijken');
      clearTimeout(teken.strijkKlok);
      teken.strijkKlok = setTimeout(() => app.classList.remove('strijken'), 2400);
    }
    koppelGrafieken(scherm);
    wachtOpLaden();
  }

  /* ---- vernieuwen ---- */

  function toonInstellingen(melding = null) {
    staat.melding = melding;
    staat.test = null;
    staat.modus = 'instellingen';
    staat.detail = null;
    teken();
  }

  function sluitInstellingen() {
    if (!staat.monitor) return;
    staat.melding = null;
    staat.test = null;
    staat.modus = 'app';
    teken();
    vernieuw();
  }

  function neemAan(tekst, opgehaald) {
    const gelezen = m.leesMonitor(tekst);
    if (!gelezen.ok) return gelezen;
    const nieuw = tekst !== staat.tekst;
    staat.tekst = tekst;
    staat.monitor = gelezen.data;
    staat.opgehaald = opgehaald;
    Ophalen.bewaarKopie(tekst, opgehaald);
    return { ok: true, nieuw };
  }

  // antwoord van GitHub → uitkomst voor het model; onthoudt wat geweigerd werd
  function uitkomstVan(r, ins) {
    let uitkomst = r.soort, nieuw = false, fout = null;
    if (r.soort === 'ok') {
      const uit = neemAan(r.tekst, new Date().toISOString());
      if (uit.ok) nieuw = uit.nieuw; else { uitkomst = 'kapot'; fout = uit.fout; }
    }
    if (uitkomst === 'token') staat.geweigerd = { soort: 'token', token: ins.token };
    if (uitkomst === 'ok') staat.geweigerd = null;
    return { uitkomst, nieuw, fout };
  }

  async function vernieuw({ zelf = false } = {}) {
    if (staat.voorbeeld || staat.bezig) return;
    const ins = Instellingen.lees();
    if (!Instellingen.volledig(ins)) {
      if (staat.modus !== 'instellingen' && !staat.monitor) toonInstellingen();
      return;
    }
    if (!m.magOphalen(ins, staat.geweigerd)) return;
    staat.bezig = true;
    let r;
    try { r = await Ophalen.haal(ins); } finally { staat.bezig = false; }

    const kopie = !!staat.monitor;               // vóór het antwoord verwerkt wordt
    const { uitkomst, nieuw } = uitkomstVan(r, ins);
    const vorig = { modus: staat.modus, regel: staat.regel };
    const volgend = m.volgendScherm(uitkomst, { modus: staat.modus, kopie, zelf });
    staat.regel = volgend.regel;

    if (vorig.modus === 'instellingen' && volgend.modus === 'app') {
      staat.melding = null; staat.test = null; staat.modus = 'app'; staat.eersteKeer = true; teken();
    } else if (vorig.modus === 'instellingen') {
      staat.melding = volgend.melding;
      if (volgend.melding === null) staat.test = null;
      werkInstellingenBij();
    } else if (volgend.modus === 'instellingen') {
      toonInstellingen(volgend.melding);
    } else if (vorig.modus === 'laden' && volgend.modus === 'app') {
      staat.modus = 'app'; staat.eersteKeer = true; teken();
    } else if (volgend.modus === 'app' && (nieuw || vorig.regel !== volgend.regel)) {
      teken({ stil: true });
    }
  }

  async function testToken() {
    const ins = Instellingen.lees();
    if (!Instellingen.volledig(ins)) { staat.test = { soort: 'onvolledig' }; werkInstellingenBij(); return; }
    const r = await Ophalen.haal(ins);
    const { uitkomst, fout } = uitkomstVan(r, ins);
    if (uitkomst === 'ok') { staat.regel = null; staat.melding = null; staat.test = { soort: 'ok' }; }
    else if (uitkomst === 'kapot') staat.test = { soort: 'kapot', fout: `Het token werkt, maar ${fout.charAt(0).toLowerCase()}${fout.slice(1)}` };
    else { staat.test = { soort: uitkomst, status: r.status }; if (uitkomst === 'token') staat.melding = null; }
    if (staat.modus === 'instellingen') werkInstellingenBij();
  }

  // wist alleen tenor.kopie; de service worker bewaart geen gegevens
  function wisKopie() {
    Ophalen.wisKopie();
    staat.monitor = null; staat.tekst = null; staat.opgehaald = null; staat.regel = null;
    werkInstellingenBij();
  }

  /* ---- gebaren van de gebruiker ---- */

  function klik(e) {
    const el = e.target.closest('[data-tab],[data-ticker],[data-terug],[data-filter],[data-filter-weg],[data-open-instellingen],[data-sluit-instellingen],[data-actie],[data-thema-keuze],[data-sortering]');
    if (!el) return;
    const ds = el.dataset;
    if (ds.tab) {
      staat.filter = null;
      if (staat.modus === 'instellingen') { staat.melding = null; staat.modus = 'app'; staat.tab = ds.tab; teken(); vernieuw(); return; }
      staat.tab = ds.tab; staat.detail = null; teken();
    } else if (ds.terug !== undefined) {
      staat.detail = null; teken({ beweging: 'van-detail' });
    } else if (ds.filterWeg !== undefined) {
      staat.filter = null; teken({ beweging: 'van-detail' });
    } else if (ds.filter) {
      staat.filter = ds.filter; staat.tab = 'grootboek'; staat.detail = null; teken({ beweging: 'naar-detail' });
    } else if (ds.openInstellingen !== undefined) {
      toonInstellingen();
    } else if (ds.sluitInstellingen !== undefined) {
      sluitInstellingen();
    } else if (ds.actie === 'test') {
      testToken();
    } else if (ds.actie === 'wis') {
      wisKopie();
    } else if (ds.themaKeuze) {
      Instellingen.bewaar({ thema: ds.themaKeuze });
      Thema.zet(ds.themaKeuze);
      document.querySelectorAll('[data-thema-keuze]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themaKeuze === ds.themaKeuze)));
    } else if (ds.sortering) {
      // 5.2: een tik op het actieve label doet niets; een ander label sorteert meteen, zonder animatie, en zet de lijst bovenaan
      if (ds.sortering === m.actieveSortering(Instellingen.lees().sortering, (staat.monitor || {}).posities)) return;
      Instellingen.bewaar({ sortering: ds.sortering });
      teken({ stil: true, bovenaan: true });
    } else if (ds.ticker) {
      staat.detail = { ticker: ds.ticker, herkomst: ds.herkomst || staat.tab };
      teken({ beweging: 'naar-detail' });
    }
  }

  function invoer(e) {
    const el = e.target.closest('[data-veld]');
    if (!el) return;
    Instellingen.bewaar({ [el.dataset.veld]: el.value.trim() });
    if (staat.test || staat.melding) { staat.test = null; staat.melding = null; werkInstellingenBij(); }
  }

  // 2: niet bij elke toetsaanslag ophalen, wel als een veld de aandacht verliest
  function veldLos(e) {
    if (e.target.closest('[data-veld]') && staat.modus === 'instellingen') vernieuw({ zelf: true });
  }

  // 5.7: lange druk van 600 ms op het merk opent Instellingen
  function langeDruk() {
    let klok = null, start = null;
    const stop = () => { clearTimeout(klok); klok = null; };
    document.addEventListener('pointerdown', e => {
      const merk = e.target.closest('[data-lange-druk]');
      if (!merk) return;
      start = { x: e.clientX, y: e.clientY };
      klok = setTimeout(() => { klok = null; toonInstellingen(); }, 600);
    });
    document.addEventListener('pointermove', e => {
      if (klok && start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 10) stop();
    });
    ['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, stop));
    document.addEventListener('contextmenu', e => { if (e.target.closest('[data-lange-druk]')) e.preventDefault(); });
  }

  // 2: neerwaartse trek op een lijstscherm; het merk strijkt zich mee met de vinger en opnieuw bij loslaten
  const DREMPEL = 64;
  function trekOmTeVernieuwen() {
    const scherm = document.getElementById('scherm');
    let beginY = null, afstand = 0;
    const merkDelen = () => document.querySelectorAll('#kop .merk-boven, #kop .merk-onder, #kop .s-noot');
    const zetMerk = f => merkDelen().forEach(el => {
      if (el.classList.contains('s-noot')) el.style.opacity = f >= 1 ? '1' : '0';
      else el.style.transform = `scaleX(${f})`;
    });
    const herstel = () => merkDelen().forEach(el => { el.style.transform = ''; el.style.opacity = ''; });
    const magTrekken = () => staat.modus === 'app' && !staat.detail;

    scherm.addEventListener('touchstart', e => {
      beginY = magTrekken() && scherm.scrollTop <= 0 ? e.touches[0].clientY : null;
      afstand = 0;
    }, { passive: true });
    scherm.addEventListener('touchmove', e => {
      if (beginY === null) return;
      afstand = e.touches[0].clientY - beginY;
      if (afstand <= 0 || scherm.scrollTop > 0) { herstel(); return; }
      if (e.cancelable) e.preventDefault();
      zetMerk(Math.min(afstand / DREMPEL, 1));
    }, { passive: false });
    const los = () => {
      if (beginY === null) return;
      beginY = null;
      herstel();
      if (afstand >= DREMPEL) {
        const kop = document.getElementById('kop');
        kop.classList.remove('opnieuw'); void kop.offsetWidth; kop.classList.add('opnieuw');
        setTimeout(() => kop.classList.remove('opnieuw'), 1300);
        vernieuw();
      }
    };
    scherm.addEventListener('touchend', los);
    scherm.addEventListener('touchcancel', los);
  }

  /* ---- opstart ---- */

  let gekoppeld = false;
  function koppel() {
    if (gekoppeld) return;
    gekoppeld = true;
    const app = document.getElementById('app');
    app.addEventListener('click', klik);
    app.addEventListener('input', invoer);
    app.addEventListener('change', veldLos);
    langeDruk();
    trekOmTeVernieuwen();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      Thema.pasToe();
      if (staat.modus === 'app') teken({ stil: true });
      vernieuw();
    });
    window.addEventListener('online', () => vernieuw());
  }

  function opstarten() {
    const ins = Instellingen.lees();
    Thema.zet(ins.thema);
    koppel();
    const kopie = Ophalen.leesKopie();
    if (kopie) {
      const gelezen = m.leesMonitor(kopie.tekst);
      if (gelezen.ok) { staat.monitor = gelezen.data; staat.tekst = kopie.tekst; staat.opgehaald = kopie.opgehaald || null; }
    }
    if (!Instellingen.volledig(ins)) { staat.modus = 'instellingen'; teken(); return; }
    staat.modus = staat.monitor ? 'app' : 'laden';
    teken();
    vernieuw();
  }

  // voorbeeldweergave: vaste gegevens, zonder ophalen
  function start(monitor, opties = {}) {
    staat.voorbeeld = true;
    staat.monitor = m.leesMonitor(monitor).data;
    if (opties.nu) staat.nu = () => new Date(opties.nu);
    if (opties.tab) staat.tab = opties.tab;
    Thema.zet(Instellingen.lees().thema);
    koppel();
    staat.modus = 'app';
    teken();
  }

  return { opstarten, start, teken, staat };
})();
/* ==== einde schermen ==== */


/* ==== thema ==== */
const Thema = (() => {
  'use strict';
  let keuze = 'automatisch';
  const STATUSBALK = { dag: '#F5F1E8', avond: '#131215', dagRust: '#EFE9DA', avondRust: '#0F0E11' };

  // zet thema en rust op <html> en laat de statusbalk meekleuren
  function pasToe(nu = new Date()) {
    const root = document.documentElement;
    const t = Model.thema(keuze, nu);
    root.dataset.thema = t;
    const rust = root.hasAttribute('data-rust');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', STATUSBALK[t + (rust ? 'Rust' : '')]);
    return t;
  }

  function zet(nieuw) { keuze = nieuw; return pasToe(); }

  function rust(aan) {
    const root = document.documentElement;
    if (aan) root.dataset.rust = ''; else delete root.dataset.rust;
    pasToe();
  }

  setInterval(() => pasToe(), 60000);
  return { pasToe, zet, rust };
})();
/* ==== einde thema ==== */

</script>

if ('serviceWorker' in navigator && window.isSecureContext && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
