<style>
/* ==== letters ==== */
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(./letters/ibm-plex-mono-normal-400.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url(./letters/ibm-plex-mono-normal-500.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url(./letters/ibm-plex-sans-normal-400.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url(./letters/ibm-plex-sans-normal-400.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url(./letters/ibm-plex-sans-normal-400.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 400; font-display: swap; src: url(./letters/newsreader-italic-400.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 400; font-display: swap; src: url(./letters/newsreader-normal-400.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 500; font-display: swap; src: url(./letters/newsreader-normal-400.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
/* ==== einde letters ==== */

/* ==== thema: kleuren, letters, maat ==== */
:root {
  --grond: #F5F1E8; --grond-2: #ECE6D8; --inkt: #14181C; --sub: #3A4048; --mute: #6B6960; --lijn: #DCD5C6;
  --goud: #A8791C; --goud-inkt: #7D5A12; --goud-zacht: #EFE3C6; --grafiet: #8E97A1; --baksteen: #8A3B2B;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'IBM Plex Mono', Menlo, 'SF Mono', monospace;
  --marge: 22px;
  --curve: cubic-bezier(.4, 0, .2, 1);
  /* de veilige zones: alleen hier env(); een test bootst de uitsparing na door een variabele te zetten */
  --veilig-boven: env(safe-area-inset-top);
  --veilig-rechts: env(safe-area-inset-right);
  --veilig-onder: env(safe-area-inset-bottom);
  --veilig-links: env(safe-area-inset-left);
  color-scheme: light;
}
html[data-rust] { --grond: #EFE9DA; }
html[data-thema="avond"] {
  --grond: #131215; --grond-2: #1B191E; --inkt: #F2EEE6; --sub: #BDB7AC; --mute: #8F8A80; --lijn: #2A272D;
  --goud: #D6B25E; --goud-inkt: #D6B25E; --goud-zacht: #2A2418; --grafiet: #6F6B64; --baksteen: #D98572;
  color-scheme: dark;
}
html[data-thema="avond"][data-rust] { --grond: #0F0E11; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--grond); transition: background-color 2.4s var(--curve); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* de buitenste laag: de veilige zones links en rechts, met de kolom (.app) daarbinnen */
body {
  padding-left: var(--veilig-links); padding-right: var(--veilig-rechts);
  color: var(--inkt); font: 400 15px/1.4 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; text-align: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--goud); outline-offset: 2px; }
svg { display: block; }

/* de kolom: in elke stand hoogstens 440 px, gecentreerd binnen de veilige zone, de tabbalk inbegrepen.
   Geen eigen achtergrond: links en rechts ervan ligt dezelfde grond, en de spot mag over de rand vallen. */
.app {
  position: relative; height: 100dvh; display: flex; flex-direction: column;
  max-width: 440px; margin-inline: auto;
}
.app > * { position: relative; z-index: 1; }
.app > .spot { position: absolute; z-index: 0; }

/* ---- kop ---- */
.kop {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 44px; padding: calc(8px + var(--veilig-boven)) var(--marge) 0;
}
.merk { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.merk svg { width: 46px; height: 28px; overflow: visible; }
.merk-woord { font: 500 12px/1 var(--mono); letter-spacing: .22em; color: var(--inkt); }
.merk-boven, .merk-noot { fill: var(--goud); }
.merk-onder { fill: var(--grafiet); }
.terug { display: flex; align-items: center; gap: 6px; min-height: 44px; margin-left: -6px; padding-right: 8px; color: var(--inkt); }
.terug svg { width: 22px; height: 22px; }
.cadence { font: 400 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.cadence.alarm { color: var(--baksteen); }
.kop-rechts { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.tandwiel { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -11px; color: var(--mute); }
.tandwiel svg { width: 22px; height: 22px; }
.terug-label { color: var(--inkt); }
.merk { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.merk.groot svg { width: 92px; height: 56px; }

/* ---- scherm ---- */
.scherm { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 28px; }
.titel-rij {
  display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px;
  padding: 10px var(--marge) 0;
}
.titel { font: 500 34px/1.15 var(--serif); letter-spacing: -.01em; }
.onderregel { margin-left: auto; font: 400 12px/1.4 var(--mono); color: var(--mute); white-space: nowrap; }
.vast { position: sticky; top: 0; z-index: 2; }
/* de grond van de vaste kop ligt in ::before, zodat hij weg kan zonder dat er bij draaien een overgang start */
.vast::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--grond); transition: background-color 2.4s var(--curve); }
/* de spot ligt onder de inhoud; de vaste kop draagt dezelfde lichtvlek, zodat er geen rand ontstaat */
html[data-thema="avond"] .vast::before {
  background-image: radial-gradient(300px circle at -60px calc(-60px - var(--kophoogte, 52px)), rgba(214, 178, 94, .16), rgba(214, 178, 94, 0));
}
/* een vaste kop blijft alleen staan bij een venster van minstens 600 px hoog; lager scrolt hij mee,
   en dan zonder eigen grond, zodat de spot erdoor valt zoals op de rest van de inhoud */
@media (max-height: 599px) { .vast { position: static; } .vast::before { display: none; } }

.zin-blok { display: flex; gap: 12px; align-items: flex-start; padding: 10px var(--marge) 0; }
.zin { font: italic 400 18px/1.35 var(--serif); color: var(--sub); max-width: 34ch; }
.zin-blok .rustteken { width: 30px; height: 30px; flex: none; margin-top: 1px; }
.zin-extra { padding: 6px var(--marge) 0; font-size: 12.5px; color: var(--sub); }
.alarm, .zin.alarm, .zin-extra.alarm { color: var(--baksteen); }
.melding { padding-top: 12px; font-size: 13px; }
.kopie-regel { margin: 0 var(--marge); padding-top: 2px; font: 400 12.5px/1.35 var(--sans); color: var(--mute); }

.label { font: 400 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.label.goud, .goud-tekst { color: var(--goud-inkt); }
.mono { font-family: var(--mono); }
.heel { white-space: nowrap; }
.lijn { height: 1px; background: var(--lijn); margin: 0 var(--marge); }

/* ---- Stand ---- */
.held-blok { padding: 22px var(--marge) 0; }
.held-blok .label { margin-bottom: 8px; }
.held { font: 500 72px/1 var(--serif); letter-spacing: -.025em; display: flex; align-items: baseline; }
.held .eenheid { font: 500 14px/1 var(--mono); letter-spacing: 0; color: var(--goud-inkt); margin-left: 8px; }

.balken { padding: 18px var(--marge) 16px; }
.balkrij { position: relative; display: flex; align-items: center; min-height: 24px; }
.balkrij .spoor { position: absolute; left: 0; top: 50%; right: 0; height: 0; }
.balk { position: absolute; left: 0; top: 50%; transform-origin: left center; }
.balk.tenor { height: 5px; margin-top: -2.5px; border-radius: 2.5px; background: var(--goud); }
.balk.baseline { height: 4px; margin-top: -2px; border-radius: 2px; background: var(--grafiet); }
.balkwaarde { margin-left: auto; font: 400 13px/1 var(--mono); white-space: nowrap; }
.balkwaarde.gedimd { color: var(--mute); }
.legende { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }

.grafiek-blok { padding: 16px var(--marge) 6px; }
.aflezing { font: 400 12px/1.4 var(--mono); min-height: 17px; margin-bottom: 4px; white-space: nowrap; visibility: hidden; }
.aflezing.zichtbaar { visibility: visible; }
.grafiek { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.grafiek svg { width: 100%; height: auto; overflow: visible; }
.raster { stroke: var(--lijn); stroke-width: 1; }
.as-tekst { font: 400 11px var(--mono); fill: var(--mute); }
.reeks { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.reeks.tenor { stroke: var(--goud); stroke-width: 2.5; }
.reeks.baseline { stroke: var(--grafiet); stroke-width: 2.5; }
.reeks.sma { stroke: var(--grafiet); stroke-width: 2; }
.noot { fill: var(--goud); }
.peil { stroke: var(--mute); stroke-width: 1; }
.as-onder { display: flex; justify-content: space-between; margin-top: 6px; font: 400 11px/1 var(--mono); color: var(--mute); }

/* ---- rijen ---- */
.rijen { margin: 0 var(--marge); }
.rij {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 11px 0;
  border-top: 1px solid var(--lijn);
}
.rijen > .rij:first-child.zonder-lijn { border-top: 0; }
.rij-hoofd { flex: 1; min-width: 0; }
.rij-titel { font: 400 15px/1.3 var(--sans); }
.rij-sub { font: 400 12.5px/1.35 var(--sans); color: var(--mute); margin-top: 2px; }
.rij-rechts { flex: none; text-align: right; font: 400 13px/1.3 var(--mono); white-space: nowrap; }
.rij-rechts.tekst { font-family: var(--sans); }
.rij-rechts .klein { display: block; font-size: 11px; color: var(--mute); margin-top: 3px; }
.met-teken { display: inline-flex; align-items: center; gap: 6px; }
.met-teken .rustteken { width: 16px; height: 16px; }
.rij.met-onder { flex-wrap: wrap; row-gap: 0; }
.voortgang { flex: 0 0 100%; height: 2px; background: var(--lijn); margin-top: 9px; position: relative; }
.voortgang span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--goud); transform-origin: left center; }
.stip { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--goud); margin-right: 7px; vertical-align: 1px; }

.tag {
  display: inline-block; flex: none; font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid currentColor; border-radius: 3px; padding: 2px 7px; white-space: nowrap;
}
.tag-verkoop { color: var(--baksteen); border-color: var(--baksteen); }
.tag-koop, .tag-afroming { color: var(--goud-inkt); border-color: var(--goud); }
.tag-afroombaar { color: var(--goud-inkt); border-color: var(--goud); background: var(--goud-zacht); }
.tag-tracker, .tag-restje, .tag-dividend { color: var(--mute); border-color: var(--mute); }

/* ---- Laden ---- */
.app[data-modus="laden"] .kop, .tabbalk[hidden] { display: none; }
.app[data-modus="laden"] .scherm { display: flex; align-items: center; justify-content: center; padding: 0 var(--marge); }
.laden { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
.laden-wacht { margin-top: -8px; font: 400 12.5px/1.35 var(--sans); color: var(--mute); }

/* ---- Instellingen ---- */
.veld { display: block; padding: 18px var(--marge) 0; }
.veld > .label { display: block; margin-bottom: 2px; }
.invoer {
  display: block; width: 100%; min-height: 44px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--lijn); border-radius: 0;
  background: transparent; color: var(--inkt); font: 400 16px/1.3 var(--sans); -webkit-appearance: none; appearance: none;
}
.invoer:focus { outline: none; border-bottom-color: var(--inkt); }
.veld + .rijen, .veld-onder + .veld + .rijen { margin-top: 14px; }
.veld-regel { padding: 6px var(--marge) 0; font: 400 12.5px/1.35 var(--sans); color: var(--mute); }
.rijen.ruimte { margin-top: 24px; }
.keuzes { display: flex; border-bottom: 1px solid var(--lijn); }
.keuze { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; color: var(--mute); }
.keuze .label { color: inherit; }
.keuze .tabnoot { width: 4px; height: 4px; border-radius: 50%; background: var(--goud); visibility: hidden; }
.keuze[aria-pressed="true"] { color: var(--inkt); }
.keuze[aria-pressed="true"] .tabnoot { visibility: visible; }
.rij.cash { justify-content: space-between; }

/* ---- Portefeuille ---- */
.sorteerregel { padding: 4px var(--marge) 0; }
.rijen.portefeuille > :first-child { border-top: 0; }
.positie { display: block; padding: 11px 0; }
.rangnummer { flex: none; width: 24px; text-align: right; font: 400 13px/1.3 var(--mono); color: var(--mute); }
.grenslijn { display: flex; align-items: center; min-height: 44px; padding: 11px 0; border-top: 1px solid var(--lijn); }
.positie-lijn { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ticker { font: 400 14px/1.3 var(--mono); flex: none; }
.naam { font: 400 13px/1.3 var(--sans); color: var(--mute); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rendement, .gewicht { font: 400 13px/1.3 var(--mono); white-space: nowrap; flex: none; }
.gewicht { min-width: 44px; text-align: right; }

/* ---- Vandaag ---- */
.sectie { padding: 20px var(--marge) 0; }
.sectie-kop { display: flex; justify-content: space-between; padding-bottom: 8px; }
.sectie .rij:first-of-type { border-top: 1px solid var(--lijn); }
.transactie { align-items: flex-start; }
.transactie .positie-lijn .tag { margin-right: 2px; }
.reden { font: 400 13px/1.35 var(--sans); color: var(--sub); margin-top: 4px; }
.leeg { font: 400 13px/1.4 var(--sans); color: var(--sub); padding: 12px 0 2px; border-top: 1px solid var(--lijn); }

/* ---- Grootboek ---- */
.strook { display: grid; grid-template-columns: repeat(3, 1fr); margin: 14px var(--marge) 0; border-top: 1px solid var(--lijn); border-bottom: 1px solid var(--lijn); }
.strook > div { padding: 10px 0 10px 12px; border-left: 1px solid var(--lijn); }
.strook > div:first-child { border-left: 0; padding-left: 0; }
.strook-waarde { font: 500 22px/1.2 var(--serif); margin-top: 4px; white-space: nowrap; }
.dag { padding: 20px var(--marge) 0; }
.dag .label { padding-bottom: 8px; }

/* ---- Detail ---- */
.detail-kop { padding: 8px var(--marge) 0; }
.detail-meta { font: 400 12px/1.4 var(--mono); color: var(--mute); }
.detail-naam { display: flex; align-items: center; gap: 12px; }
.detail-naam .titel { flex: 1; min-width: 0; }
.kolommen { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px var(--marge) 0; }
.kolom-waarde { font: 500 30px/1.15 var(--serif); letter-spacing: -.01em; margin-top: 6px; white-space: nowrap; }
.kolom-waarde.goud { color: var(--goud); }
.kolom-sub { font: 400 12.5px/1.35 var(--sans); color: var(--mute); margin-top: 4px; }
.beschrijving {
  font: 400 13px/1.4 var(--sans); color: var(--sub); margin-top: 6px;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.instapstreep { stroke: var(--lijn); stroke-width: 1; }
.as-onder { position: relative; }
.instap-label { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.sma-label { font: 400 10.5px var(--mono); letter-spacing: .14em; fill: var(--mute); }

/* ---- tabbalk ---- */
.tabbalk { display: flex; border-top: 1px solid var(--lijn); padding-bottom: var(--veilig-onder); background: var(--grond); transition: background-color 2.4s var(--curve); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 58px; padding: 8px 0 6px; color: var(--mute); }
.tab svg { width: 22px; height: 22px; }
.tab .label { color: inherit; }
.tab .tabnoot { width: 4px; height: 4px; border-radius: 50%; background: var(--goud); visibility: hidden; }
.tab[aria-current="page"] { color: var(--inkt); }
.tab[aria-current="page"] .tabnoot { visibility: visible; }
.icoon { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.rustteken path { fill: none; stroke: var(--goud); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

.voorbeeld-label { text-align: center; padding: calc(4px + var(--veilig-boven)) 0 0; }
.voorbeeld-label + .kop { padding-top: 2px; }

/* ==== beweging: vier gebaren ==== */
@keyframes strijk { from { transform: scaleX(0); } }
@keyframes trek { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes noot-in { from { opacity: 0; transform: scale(.2); } }
@keyframes inzet { from { opacity: 0; transform: translateY(8px); } }
@keyframes spot-in { from { opacity: 0; } }
@keyframes gloei { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
@keyframes adem { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
@keyframes schuif-in { from { opacity: 0; transform: translateX(24px); } }
@keyframes schuif-terug { from { opacity: 0; transform: translateX(-24px); } }

/* 1. Strijk */
.s-balk { transform-box: fill-box; transform-origin: left center; }
.strijken .s-balk { animation: strijk 1.2s var(--curve) both; }
.strijken .s-lijn { stroke-dasharray: 1; animation: trek 1.2s var(--curve) both; }
.strijken .s-later { animation-delay: .3s; }
.s-noot { transform-box: fill-box; transform-origin: center; }
.strijken .s-noot { animation: noot-in .35s var(--curve) .78s both; }
/* binnen een blok dat inzet: de strijk begint pas als het blok verschijnt */
.strijken .inzet .s-balk, .strijken .inzet .s-lijn { animation-delay: calc(var(--stap, 0) * 120ms); }
.strijken .inzet .s-later { animation-delay: calc(var(--stap, 0) * 120ms + .3s); }
.strijken .inzet .s-noot { animation-delay: calc(var(--stap, 0) * 120ms + .78s); }

/* 2. Inzet */
.inzet { animation: inzet .6s var(--curve) both; animation-delay: calc(var(--stap, 0) * 120ms); }
.stil .inzet { animation: none; }

/* 3. Spot, alleen 's avonds */
.spot { display: none; left: -360px; top: -360px; width: 600px; height: 600px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(214, 178, 94, .16), rgba(214, 178, 94, 0)); }
html[data-thema="avond"] .spot { display: block; animation: spot-in 1.4s var(--curve) both; }
html[data-thema="avond"] .gloeit { animation: gloei 3s ease-in-out infinite; }
html[data-thema="avond"] .strijken .s-balk.gloeit { animation: strijk 1.2s var(--curve) both, gloei 3s ease-in-out infinite; animation-delay: 0s, 1.2s; }
html[data-thema="avond"] .strijken .inzet .s-balk.gloeit { animation-delay: calc(var(--stap, 0) * 120ms), calc(var(--stap, 0) * 120ms + 1.2s); }
html[data-thema="avond"] .strijken .s-noot .gloeit { animation: gloei 3s ease-in-out 1.13s infinite; }

/* 4. Rust */
html[data-rust] .rustteken { animation: adem 2.4s ease-in-out infinite; }

/* strijk opnieuw na een trek om te vernieuwen */
.opnieuw .s-balk { animation: strijk 1.2s var(--curve) both; }
.opnieuw .s-later { animation-delay: .3s; }
.opnieuw .s-noot { animation: noot-in .35s var(--curve) .78s both; }

.naar-detail { animation: schuif-in .25s ease-out both; }
.van-detail { animation: schuif-terug .25s ease-out both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="spot" aria-hidden="true"></div>
  <header class="kop" id="kop"></header>
  <main class="scherm" id="scherm"></main>
  <nav class="tabbalk" id="tabbalk" aria-label="Hoofdschermen"></nav>
</div>
<script>
/* ==== instellingen ==== */
const Instellingen = (() => {
  'use strict';
  const SLEUTEL = 'tenor.instellingen';
  const STANDAARD = { repo: '', token: '', thema: 'automatisch', sortering: 'gewicht' };

  // localStorage kan ontbreken of leeg terugkomen; de app werkt dan met de standaard
  function lees() {
    try {
      const ruw = JSON.parse(localStorage.getItem(SLEUTEL) || '{}');
      return {
        repo: typeof ruw.repo === 'string' ? ruw.repo : STANDAARD.repo,
        token: typeof ruw.token === 'string' ? ruw.token : STANDAARD.token,
        thema: ['automatisch', 'dag', 'avond'].includes(ruw.thema) ? ruw.thema : STANDAARD.thema,
        sortering: ['gewicht', 'instap', 'rang'].includes(ruw.sortering) ? ruw.sortering : STANDAARD.sortering
      };
    } catch (e) { return { ...STANDAARD }; }
  }

  function bewaar(deel) {
    const nieuw = { ...lees(), ...deel };
    try { localStorage.setItem(SLEUTEL, JSON.stringify(nieuw)); } catch (e) { /* opslag niet beschikbaar */ }
    return nieuw;
  }

  const volledig = ins => !!(ins.token && ins.repo);

  return { lees, bewaar, volledig };
})();
/* ==== einde instellingen ==== */


/* ==== ophalen ==== */
const Ophalen = (() => {
  'use strict';
  const KOPIE = 'tenor.kopie';
  const TIJDSLIMIET = 15000;

  // één fetch naar monitor.json, hoogstens 15 s;
  // geeft { soort: 'ok' | 'token' | 'niet-gevonden' | 'fout' | 'offline' | 'time-out' | 'onvolledig', tekst?, status? }
  async function haal({ repo, token }) {
    if (!token) return { soort: 'onvolledig' };
    const url = Model.monitorUrl(repo);
    if (!url) return { soort: 'niet-gevonden' };
    const stop = new AbortController();
    const klok = setTimeout(() => stop.abort(), TIJDSLIMIET);
    try {
      const antwoord = await fetch(url, {
        headers: { Accept: 'application/vnd.github.raw+json', Authorization: `Bearer ${token}` },
        cache: 'no-store', signal: stop.signal
      });
      const soort = Model.ophaalSoort(antwoord.status);
      if (soort !== 'ok') return { soort, status: antwoord.status };
      return { soort: 'ok', tekst: await antwoord.text() };
    } catch (e) {
      return { soort: stop.signal.aborted ? 'time-out' : 'offline' };
    } finally {
      clearTimeout(klok);
    }
  }

  function leesKopie() {
    try {
      const ruw = JSON.parse(localStorage.getItem(KOPIE) || 'null');
      return ruw && typeof ruw.tekst === 'string' ? ruw : null;
    } catch (e) { return null; }
  }

  function bewaarKopie(tekst, opgehaald) {
    try { localStorage.setItem(KOPIE, JSON.stringify({ tekst, opgehaald })); return true; }
    catch (e) { return false; }
  }

  function wisKopie() {
    try { localStorage.removeItem(KOPIE); } catch (e) { /* niets te wissen */ }
  }

  return { haal, leesKopie, bewaarKopie, wisKopie };
})();
/* ==== einde ophalen ==== */


/* ==== model ==== */
const Model = (() => {
  'use strict';

  const MIN = '\u2212';          // typografisch min-teken
  const HARDE_SPATIE = '\u00a0'; // "€ 101.240" breekt nooit af

  const isGetal = v => typeof v === 'number' && isFinite(v);

  /* ---- formattering ---- */

  // rondt |n| af op 'decimalen' plaatsen, half van nul af, op het getal zoals het decimaal geschreven staat;
  // 'schuif' verplaatst eerst de komma (2 = procent), zodat 0,0215 "2,2" wordt en nooit "2,1" door 2,1499999…
  function decimaal(n, decimalen, schuif = 0) {
    const [mantisse, macht] = Math.abs(n).toExponential().split('e');
    const cijfers = mantisse.replace('.', '');
    const lengte = Number(macht) + schuif + 1;               // aantal cijfers vóór de komma
    const geheel = lengte > 0 ? cijfers.slice(0, lengte).padEnd(lengte, '0') : '0';
    const breuk = lengte > 0 ? cijfers.slice(lengte) : '0'.repeat(-lengte) + cijfers;
    let som = BigInt(geheel + breuk.slice(0, decimalen).padEnd(decimalen, '0'));
    if ((breuk.charAt(decimalen) || '0') >= '5') som += 1n;
    const tekst = som.toString().padStart(decimalen + 1, '0');
    return { geheel: tekst.slice(0, tekst.length - decimalen), deel: tekst.slice(tekst.length - decimalen) };
  }

  function getal(n, decimalen = 0, schuif = 0) {
    if (!isGetal(n)) return '';
    const { geheel, deel } = decimaal(n, decimalen, schuif);
    const tekst = geheel.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (deel ? ',' + deel : '');
    return (n < 0 && /[1-9]/.test(geheel + deel) ? MIN : '') + tekst;
  }

  // stuks: heel zonder komma, een breukdeel met hoogstens vier decimalen zonder nullen achteraan
  function aantal(n) {
    if (!isGetal(n)) return '';
    return getal(n, 4).replace(/,?0+$/, '');
  }

  function euro(n, decimalen = 0) {
    if (typeof n !== 'number' || !isFinite(n)) return '';
    const zonder = getal(Math.abs(n), decimalen);
    const negatief = n < 0 && zonder.replace(/[^1-9]/g, '') !== '';
    return (negatief ? MIN : '') + '€' + HARDE_SPATIE + zonder;
  }

  // f is een fractie (0,012 = 1,2%)
  function pct(f, decimalen = 1, teken = false) {
    if (!isGetal(f)) return '';
    const tekst = getal(f, decimalen, 2);
    const positief = f > 0 && tekst.replace(/[^1-9]/g, '') !== '';
    return (teken && positief ? '+' : '') + tekst + '%';
  }

  // procentpunten uit een fractie; de eenheid "pt" zet het scherm er zelf naast
  function pt(f, decimalen = 1) {
    if (!isGetal(f)) return '';
    return getal(f, decimalen, 2);
  }

  // onder 10% één decimaal, vanaf 10% geen (Detail: rendement en de woorden bij de SMA-lijn)
  const procentDecimalen = f => (Number(decimaal(f, 1, 2).geheel) >= 10 ? 0 : 1);

  // 5.6: de ligging van de koers ten opzichte van de SMA200, in woorden en zonder teken
  function smaLabel(f) {
    if (!isGetal(f)) return '';
    const tekst = pct(Math.abs(f), procentDecimalen(f));
    if (!/[1-9]/.test(tekst)) return 'KOERS GELIJK AAN SMA200';
    return `KOERS ${tekst} ${f > 0 ? 'BOVEN' : 'ONDER'} SMA200`;
  }

  const DAG_KORT = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
  const MAAND_KORT = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

  function leesDatum(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const [j, m, d] = s.split('-').map(Number);
    const dt = new Date(j, m - 1, d);
    return dt.getMonth() === m - 1 && dt.getDate() === d ? dt : null;
  }

  const twee = n => String(n).padStart(2, '0');

  // vormen: kort "do 10 sep 2026" · lang "DO 10 SEP" · dmj "9 sep 2027"
  //         dm en as "9 sep" · wdm "do 14 aug" · cijfers "31-01-2024" · dagmaand "31-08"
  function datum(s, vorm = 'kort') {
    const dt = s instanceof Date ? s : leesDatum(s);
    if (!dt) return '';
    const d = dt.getDate(), m = dt.getMonth(), j = dt.getFullYear(), w = dt.getDay();
    switch (vorm) {
      case 'lang': return `${DAG_KORT[w]} ${d} ${MAAND_KORT[m]}`.toUpperCase();
      case 'dmj': return `${d} ${MAAND_KORT[m]} ${j}`;
      case 'dm': case 'as': return `${d} ${MAAND_KORT[m]}`;
      case 'wdm': return `${DAG_KORT[w]} ${d} ${MAAND_KORT[m]}`;
      case 'cijfers': return `${twee(d)}-${twee(m + 1)}-${j}`;
      case 'dagmaand': return `${twee(d)}-${twee(m + 1)}`;
      default: return `${DAG_KORT[w]} ${d} ${MAAND_KORT[m]} ${j}`;
    }
  }

  function leesTijd(iso) {
    if (typeof iso !== 'string') return null;
    const dt = new Date(iso);
    return isNaN(dt.getTime()) ? null : dt;
  }

  function tijd(iso) {
    const dt = iso instanceof Date ? iso : leesTijd(iso);
    return dt ? `${twee(dt.getHours())}:${twee(dt.getMinutes())}` : '';
  }

  const WOORDEN = ['nul', 'één', 'twee', 'drie', 'vier', 'vijf', 'zes', 'zeven', 'acht', 'negen', 'tien', 'elf', 'twaalf'];
  const inWoorden = n => (Number.isInteger(n) && n >= 0 && n < WOORDEN.length ? WOORDEN[n] : String(n));

  const hoofdletter = t => (t.startsWith('één') ? 'Eén' + t.slice(3) : t.charAt(0).toUpperCase() + t.slice(1));

  const stuks = n => (isGetal(n) ? `${aantal(n)}${HARDE_SPATIE}st` : '');
  const dagenTekst = n => (n === 1 ? '1 dag' : `${getal(n)} dagen`);

  // lege sectie op Vandaag: één zin in Sub (5.3)
  function legeZin(soort, { rust = false, open_plaatsen, cash } = {}) {
    if (soort === 'verkopen') return 'Geen verkopen.';
    if (soort === 'afromingen') return 'Geen afromingen.';
    const begin = rust ? 'Geen aankopen tijdens Rest.' : 'Geen aankopen.';
    if (typeof open_plaatsen !== 'number' || !isFinite(open_plaatsen)) return begin;
    if (open_plaatsen === 0) return rust ? `${begin} Alle plaatsen zijn bezet.` : 'Geen aankopen; alle plaatsen zijn bezet.';
    const plaatsen = `${hoofdletter(inWoorden(open_plaatsen))} ${open_plaatsen === 1 ? 'plaats' : 'plaatsen'} open`;
    const geld = typeof cash === 'number' && isFinite(cash) ? `, ${euro(cash)} in cash` : '';
    return `${begin} ${plaatsen}${geld}.`;
  }

  /* ---- kalender ---- */

  const middernacht = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const isWerkdag = dt => dt.getDay() !== 0 && dt.getDay() !== 6;

  // werkdagen na 'van' tot en met 'tot' (feestdagen niet meegeteld)
  function handelsdagenTussen(van, tot) {
    let d = middernacht(van), eind = middernacht(tot), n = 0;
    while (d < eind) {
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      if (isWerkdag(d)) n++;
    }
    return n;
  }

  function kalenderdagenTussen(van, tot) {
    return Math.round((middernacht(tot) - middernacht(van)) / 86400000);
  }

  function relatieveDag(dt, nu) {
    const verschil = kalenderdagenTussen(dt, nu);
    if (verschil === 0) return 'vandaag';
    if (verschil === 1) return 'gisteren';
    return datum(dt, 'dm');
  }

  // volgende avondrun: vanavond als er vandaag (werkdag) nog geen run was
  function volgendeRun(laatsteRun, nu) {
    if (isWerkdag(nu) && (!laatsteRun || kalenderdagenTussen(laatsteRun, nu) > 0)) return 'vanavond';
    const morgen = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate() + 1);
    return isWerkdag(morgen) ? 'morgenavond' : 'maandag';
  }

  // "offline · kopie van 18:21" bij een netwerkfout of time-out, "niet bijgewerkt · kopie van 18:21" bij elke andere fout;
  // de dag komt erbij als de kopie niet van vandaag is
  function kopieRegel(soort, opgehaald, nu) {
    const begin = soort === 'offline' ? 'offline' : 'niet bijgewerkt';
    const dt = opgehaald instanceof Date ? opgehaald : leesTijd(opgehaald);
    if (!dt) return begin;
    const wanneer = kalenderdagenTussen(dt, nu) === 0 ? tijd(dt) : `${datum(dt, 'wdm')} ${tijd(dt)}`;
    return `${begin} · kopie van ${wanneer}`;
  }

  /* ---- ophalen ---- */

  function ophaalSoort(status) {
    if (status >= 200 && status < 300) return 'ok';
    if (status === 401 || status === 403) return 'token';
    if (status === 404) return 'niet-gevonden';
    return 'fout';
  }

  // uitkomst: 'ok' | 'kapot' (geen geldige JSON) | 'token' (401/403) | 'niet-gevonden' (404)
  //          | 'fout' (5xx en andere) | 'offline' | 'time-out'
  // modus:   'laden' | 'app' | 'instellingen'; kopie: er stond al een geldige monitor.json in de app
  // zelf:    het ophalen kwam van de gebruiker in Instellingen (veld verlaten), niet van openen of terugkeer
  // geeft:   { modus, melding: null | 'token' | 'niet-gevonden', regel: null | 'offline' | 'niet-bijgewerkt' }
  //          regel = wat er onder de Cadence-rij staat zolang de kopie getoond wordt
  function volgendScherm(uitkomst, { modus, kopie, zelf = false }) {
    // gelukt: naar de app. Wie in Instellingen zit blijft daar, tenzij er nog geen kopie was en het ophalen
    // bij terugkeer naar de voorgrond gebeurde: dan opent de app vanzelf zodra het bestand er is
    if (uitkomst === 'ok') return { modus: modus === 'instellingen' && (kopie || zelf) ? 'instellingen' : 'app', melding: null, regel: null };
    const regel = !kopie ? null : (uitkomst === 'offline' || uitkomst === 'time-out' ? 'offline' : 'niet-bijgewerkt');
    if (uitkomst === 'token') return { modus: 'instellingen', melding: 'token', regel };
    // 404: zonder kopie naar Instellingen; met kopie zoals een 5xx, behalve wie al in Instellingen zit
    if (uitkomst === 'niet-gevonden' && (!kopie || modus === 'instellingen')) return { modus: 'instellingen', melding: 'niet-gevonden', regel };
    if (modus === 'instellingen') return { modus: 'instellingen', melding: null, regel };
    return { modus: kopie ? 'app' : 'laden', melding: null, regel };
  }

  // alleen een token dat GitHub weigerde wordt pas opnieuw geprobeerd als het verandert
  function magOphalen(ins, geweigerd) {
    if (!ins || !ins.token || !monitorUrl(ins.repo)) return false;
    if (geweigerd && geweigerd.soort === 'token') return ins.token !== geweigerd.token;
    return true;
  }

  // "eigenaar/repo" → adres van monitor.json in de contents-API
  function monitorUrl(repo) {
    const deel = String(repo || '').trim().replace(/^https:\/\/github\.com\//, '').replace(/\/+$/, '');
    if (!/^[A-Za-z0-9-]+\/[A-Za-z0-9._-]+$/.test(deel)) return null;
    const [eigenaar, naam] = deel.split('/');
    return `https://api.github.com/repos/${eigenaar}/${naam}/contents/monitor.json`;
  }

  /* ---- toestanden ---- */

  const HARTSLAG_GRENS = 2; // handelsdagen

  function hartslag(h, nu) {
    if (!h) return null;
    const dt = leesTijd(h.tijd);
    if (h.status === 'fout') return { soort: 'fout', tekst: h.run || '', tijd: dt };
    if (!dt) return null;
    const dagen = handelsdagenTussen(dt, nu);
    if (dagen > HARTSLAG_GRENS) return { soort: 'oud', dagen, tijd: dt };
    return { soort: 'ok', dagen, tijd: dt };
  }

  function cadenceLabel(toestand) {
    if (!toestand) return 'CADENCE';
    if (toestand.soort === 'fout') return 'CADENCE · FOUT';
    if (toestand.soort === 'oud') return `CADENCE · ${toestand.dagen} DAGEN OUD`;
    return `CADENCE ${tijd(toestand.tijd)} · OK`;
  }

  // de enige zin die de app zelf schrijft (6.1)
  function oudZin(toestand, dagVanCijfers) {
    if (!toestand || toestand.soort !== 'oud') return '';
    const van = datum(dagVanCijfers);
    return `De laatste run is ${inWoorden(toestand.dagen)} dagen oud.` +
      (van ? ` De cijfers hieronder zijn van ${van}.` : '');
  }

  // true = Rest (niets kopen), false = er wordt gekocht, null = onbekend
  function rust(monitor) {
    const mf = monitor && monitor.marktfilter;
    if (!mf || typeof mf.aan !== 'boolean') return null;
    return mf.aan === false;
  }

  function thema(keuze, nu) {
    if (keuze === 'dag' || keuze === 'avond') return keuze;
    const uur = nu.getHours();
    return uur >= 19 || uur < 7 ? 'avond' : 'dag';
  }

  function toestanden({ monitor, nu, offline = false, tokenOngeldig = false }) {
    const hs = hartslag(monitor && monitor.hartslag, nu);
    let alarm = null;
    if (tokenOngeldig) alarm = 'token';
    else if (hs && hs.soort === 'fout') alarm = 'fout';
    else if (hs && hs.soort === 'oud') alarm = 'oud';
    return { rust: rust(monitor), alarm, offline: !!offline, hartslag: hs };
  }

  /* ---- afgeleiden ---- */

  function standVerschil(stand) {
    if (!stand || !stand.start) return null;
    const { portefeuille: p, tracker: t } = stand, k = stand.start.kapitaal;
    if (!isGetal(p) || !isGetal(t) || !isGetal(k) || k <= 0) return null;
    return { tenor: p / k - 1, baseline: t / k - 1, verschil: (p - t) / k };
  }

  const LANGSTE_BALK = 0.58, KORTSTE_BALK = 0.29, KRIMP_PER_PT = 0.15;

  // de langste 58%; de kortste 58% × (1 − 0,15 × verschil in pt), nooit onder 29%
  function standBalken(stand) {
    if (!stand || !stand.start) return null;
    const { portefeuille: p, tracker: t } = stand, k = stand.start.kapitaal;
    if (!isGetal(p) || !isGetal(t) || !isGetal(k) || k <= 0) return null;
    const verschilPt = Math.abs(p - t) / k * 100;
    const kort = Math.max(LANGSTE_BALK * (1 - KRIMP_PER_PT * verschilPt), KORTSTE_BALK);
    return p >= t ? { tenor: LANGSTE_BALK, baseline: kort } : { tenor: kort, baseline: LANGSTE_BALK };
  }

  const AFROOM_GRENS = 0.08, RESTJE_GRENS = 0.01;

  const bovenAfroomgrens = g => isGetal(g) && g > AFROOM_GRENS;

  function gewichtTag(g) {
    if (!isGetal(g)) return null;
    if (g > AFROOM_GRENS) return 'AFROOMBAAR';
    if (g < RESTJE_GRENS) return 'RESTJE';
    return null;
  }

  function rendementWeergave(f, { detail = false } = {}) {
    if (!isGetal(f)) return null;
    const tekst = pct(f, detail ? procentDecimalen(f) : 1, true);
    return { tekst, positief: tekst.charAt(0) === '+' };
  }

  // bij sortering RANG komt de rang erbij: "RELX, rang 40, +2,8% sinds instap, gewicht 3,5%"
  function positieLabel(p, { rang = false } = {}) {
    const r = rendementWeergave(p.rendement);
    return [p.naam || p.ticker, rang && isGetal(p.rang) ? `rang ${getal(p.rang)}` : '',
      r ? `${r.tekst} sinds instap` : '', isGetal(p.gewicht) ? `gewicht ${pct(p.gewicht, 1)}` : '']
      .filter(Boolean).join(', ');
  }

  // Vandaag, rij Rest: het getal zonder teken als de markt eronder staat
  function maandslotTekst(afstand) {
    if (!isGetal(afstand)) return '';
    return afstand < 0
      ? `maandslot ${pct(Math.abs(afstand), 1)} onder het 10-maandsgemiddelde`
      : `maandslot ${pct(afstand, 1, true)} boven het 10-maandsgemiddelde`;
  }

  // een detailscherm blijft alleen staan zolang de naam in de posities staat
  function detailGeldig(detail, posities) {
    return !!detail && (posities || []).some(p => p.ticker === detail.ticker);
  }

  function teken(f) {
    if (!isGetal(f) || f === 0) return 0;
    return f > 0 ? 1 : -1;
  }

  /* ---- Portefeuille (5.2) ---- */

  // sleutel → [label, veld, hoogste eerst]
  const SORTERING = {
    gewicht: ['Gewicht', 'gewicht', true],
    instap: ['Sinds instap', 'rendement', true],
    rang: ['Rang', 'rang', false]
  };
  const SORTERING_STANDAARD = 'gewicht';

  // de labels van de sorteerregel; een label verdwijnt als het veld bij alle posities ontbreekt
  function sorteringen(posities) {

  }

  const sorteerLabel = k => (SORTERING[k] ? SORTERING[k][0] : '');

  function actieveSortering(keuze, posities) {

    if (er.includes(keuze)) return keuze;

  const opTicker = (a, b) => {

    return [...(posities || [])].sort((a, b) => {

  function portefeuilleRijen(monitor, sortering) {
